<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>TBS QR Scanner</title>
  <!-- Thư viện giải mã trực tiếp cực nhẹ, không sinh thẻ thừa gây lag/lệch -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }
    .header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 30;
    }
    .title { font-size: 0.95rem; font-weight: 800; color: #70B62C; letter-spacing: 0.5px; }
    .btn-close {
      background: rgba(255,255,255,0.25);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    
    /* Video căn chuẩn toàn màn hình, mượt mà */
    #scannerVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    /* Khung ngắm Laser Ngân Hàng - Căn chính giữa tâm màn hình */
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .reticle {
      width: 250px;
      height: 250px;
      position: relative;
      border-radius: 18px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }
    .reticle::before, .reticle::after {
      content: '';
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: #70B62C;
      border-style: solid;
    }
    .reticle::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 16px; }
    .reticle::after { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 16px; }
    
    .corner-tr, .corner-bl {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: #70B62C;
      border-style: solid;
    }
    .corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 16px; }
    .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 16px; }

    .laser {
      position: absolute;
      left: 6px; right: 6px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #70B62C 50%, transparent);
      box-shadow: 0 0 10px #70B62C, 0 0 16px #70B62C;
      animation: scan 1.8s infinite ease-in-out;
    }
    @keyframes scan {
      0% { top: 8%; opacity: 0.3; }
      50% { top: 88%; opacity: 1; }
      100% { top: 8%; opacity: 0.3; }
    }
    .tip {
      margin-top: 26px;
      font-size: 0.85rem;
      background: rgba(0,0,0,0.65);
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 600;
      color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">📷 QUÉT QR KỆ KHO</div>
    <button class="btn-close" onclick="window.close()">Đóng</button>
  </div>

  <video id="scannerVideo" playsinline webkit-playsinline muted autoplay></video>
  <canvas id="scannerCanvas" style="display:none;"></canvas>

  <div class="overlay">
    <div class="reticle">
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="laser"></div>
    </div>
    <div class="tip">Hướng camera vào mã QR dán trên kệ</div>
  </div>

  <script>
    let videoStream = null;
    let animFrameId = null;
    let isScanned = false;

    function playFeedback() {
      if (navigator.vibrate) navigator.vibrate(90);
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1800;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e) {}
    }

    function startCamera() {
      const video = document.getElementById('scannerVideo');
      const canvas = document.getElementById('scannerCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
          videoStream = stream;
          video.srcObject = stream;
          video.play().then(() => {
            requestAnimationFrame(() => scanFrame(video, canvas, ctx));
          });
        })
        .catch(err => {
          alert("Vui lòng cấp quyền Camera trên trình duyệt!");
        });
    }

    function scanFrame(video, canvas, ctx) {
      if (isScanned) return;

      if (video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        if (window.jsQR) {
          const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert"
          });

          if (code && code.data) {
            isScanned = true;
            playFeedback();
            const scannedCode = code.data.trim().toUpperCase();

            // Gửi dữ liệu về cho Google Apps Script
            if (window.opener) {
              window.opener.postMessage({ type: 'TBS_QR_SCANNED', code: scannedCode }, '*');
            }
            try { localStorage.setItem('tbs_last_scanned_code', scannedCode); } catch(e) {}

            setTimeout(() => {
              window.close();
            }, 250);
            return;
          }
        }
      }

      animFrameId = requestAnimationFrame(() => scanFrame(video, canvas, ctx));
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
